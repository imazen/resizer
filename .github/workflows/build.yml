name: Build ImageResizer v4

on:
  push:
    branches: [support/v4, develop]
  pull_request:
    branches: [support/v4, develop]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git tag detection

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Disable license enforcement
        # Matches AppVeyor anonymous build: copy LicensingOff.cs over LicensingOn.cs
        run: copy Plugins\LicenseVerifier\LicensingOff.cs Plugins\LicenseVerifier\LicensingOn.cs
        shell: cmd

      - name: NuGet restore (main solution)
        run: nuget restore AppVeyor.sln

      - name: NuGet restore (FastScaling solution)
        run: nuget restore Plugins\FastScaling\ImageResizer.Plugins.FastScaling.sln

      - name: Install Scoop
        shell: pwsh
        run: iex "& {$(irm get.scoop.sh)} -RunAsAdmin"

      - name: Install Ghostscript
        shell: pwsh
        run: scoop install ghostscript

      - name: Install FFmpeg
        shell: pwsh
        run: scoop install ffmpeg

      - name: Install and start Azurite
        shell: pwsh
        run: |
          npm install -g azurite
          Start-Process azurite -ArgumentList '--silent' -NoNewWindow
          Start-Sleep -Seconds 2

      - name: Install xunit runner
        run: nuget install xunit.runner.console -Version 2.9.3 -OutputDirectory Packages

      - name: Patch assembly info
        id: patch_version
        shell: pwsh
        run: scripts/patch-assembly-info.ps1 -BuildNumber ${{ github.run_number }}

      - name: Build main solution
        shell: cmd
        run: msbuild AppVeyor.sln /p:Configuration=Release /p:Platform="Any CPU" /p:Optimize=True /p:DebugSymbols=True /p:NoWarn="1591;1573;0618" /m /verbosity:minimal

      - name: Build FastScaling (Win32)
        shell: cmd
        run: msbuild Plugins\FastScaling\ImageResizer.Plugins.FastScaling.sln /p:Configuration=Release /p:Platform=Win32 /p:Optimize=True /p:DebugSymbols=True /m /verbosity:minimal

      - name: Build FastScaling (x64)
        shell: cmd
        run: msbuild Plugins\FastScaling\ImageResizer.Plugins.FastScaling.sln /p:Configuration=Release /p:Platform=x64 /p:Optimize=True /p:DebugSymbols=True /m /verbosity:minimal

      - name: Build FastScaling (ARM64)
        shell: cmd
        run: msbuild Plugins\FastScaling\ImageResizer.Plugins.FastScaling.sln /p:Configuration=Release /p:Platform=ARM64 /p:Optimize=True /p:DebugSymbols=True /m /verbosity:minimal

      # Native FastScaling tests run automatically as a post-build event
      # in NativeFastScaling.Test.vcxproj (Catch framework)

      - name: Run tests (x64)
        shell: pwsh
        run: |
          $xunit = "Packages\xunit.runner.console.2.9.3\tools\net472\xunit.console.exe"

          # Discover AnyCPU test DLLs (mirrors Build.fsx glob)
          # Exclude: CoreFSharp (F#), FakeBuilder (needs FSharp.Core)
          $testDlls = @(Get-ChildItem "Tests\binaries\release\*Tests.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "CoreFSharp|FakeBuilder|IISExpressTests" } |
            Select-Object -ExpandProperty FullName)

          # Add FastScaling x64 managed tests
          $fsTest = "Tests\binaries\release\x64\ImageResizer.Plugins.FastScaling.Tests.dll"
          if (Test-Path $fsTest) { $testDlls += (Resolve-Path $fsTest).Path }

          if ($testDlls.Count -eq 0) {
            Write-Warning "No test DLLs found!"
            exit 1
          }

          Write-Host "Running $($testDlls.Count) test assemblies (x64):"
          $testDlls | ForEach-Object { Write-Host "  $_" }

          & $xunit @testDlls -notrait "requiresmongo=true" -notrait "requiresinfra=true" -nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests (x86)
        shell: pwsh
        run: |
          $xunit = "Packages\xunit.runner.console.2.9.3\tools\net472\xunit.console.x86.exe"

          # Discover AnyCPU test DLLs, excluding some that don't work under x86
          # (mirrors Build.fsx exclusions for x86 run)
          # Exclude: FakeBuilder (needs FSharp.Core), AllPlugins/CopyMetadata/TinyCache (x86 incompatible)
          # LicenseVerifier excluded from x86 (race condition in Test_Revocations; fully covered in x64)
          $testDlls = @(Get-ChildItem "Tests\binaries\release\*Tests.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "CoreFSharp|AllPlugins|CopyMetadata|TinyCache|FakeBuilder|LicenseVerifier|IISExpressTests" } |
            Select-Object -ExpandProperty FullName)

          # Add FastScaling x86 managed tests
          $fsTest = "Tests\binaries\release\x86\ImageResizer.Plugins.FastScaling.Tests.dll"
          if (Test-Path $fsTest) { $testDlls += (Resolve-Path $fsTest).Path }

          if ($testDlls.Count -eq 0) {
            Write-Warning "No test DLLs found!"
            exit 1
          }

          Write-Host "Running $($testDlls.Count) test assemblies (x86):"
          $testDlls | ForEach-Object { Write-Host "  $_" }

          & $xunit @testDlls -notrait "requiresmongo=true" -notrait "requiresinfra=true" -nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run IIS Express integration tests (x64)
        shell: pwsh
        run: |
          $xunit = "Packages\xunit.runner.console.2.9.3\tools\net472\xunit.console.exe"
          $dll = "Tests\binaries\release\ImageResizer.IISExpressTests.dll"
          if (Test-Path $dll) {
            Write-Host "Running IIS Express integration tests..."
            & $xunit $dll -trait "requiresiisexpress=true" -nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Warning "IIS Express test DLL not found at $dll — skipping"
          }

      - name: Pack NuGet packages
        shell: pwsh
        run: >
          scripts/pack-nuget.ps1
          -Version "${{ steps.patch_version.outputs.nuget_version || '0.0.0-ci' }}"
          -IncludeFastScaling

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: Releases/nuget-packages/*.nupkg
          if-no-files-found: warn

      - name: Upload build DLLs
        uses: actions/upload-artifact@v4
        with:
          name: build-dlls
          path: |
            dlls/release/**/*.dll
            dlls/release/**/*.pdb
            dlls/release/**/*.xml
          if-no-files-found: warn

  test-fastscaling-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Disable license enforcement
        run: copy Plugins\LicenseVerifier\LicensingOff.cs Plugins\LicenseVerifier\LicensingOn.cs
        shell: cmd

      - name: NuGet restore (main solution)
        run: nuget restore AppVeyor.sln

      - name: NuGet restore (FastScaling solution)
        run: nuget restore Plugins\FastScaling\ImageResizer.Plugins.FastScaling.sln

      - name: Install xunit runner
        run: nuget install xunit.runner.console -Version 2.9.3 -OutputDirectory Packages

      - name: Patch assembly info
        id: patch_version
        shell: pwsh
        run: scripts/patch-assembly-info.ps1 -BuildNumber ${{ github.run_number }}

      - name: Build main solution
        shell: cmd
        run: msbuild AppVeyor.sln /p:Configuration=Release /p:Platform="Any CPU" /p:Optimize=True /p:DebugSymbols=True /p:NoWarn="1591;1573;0618" /m /verbosity:minimal

      - name: Build FastScaling (ARM64)
        shell: cmd
        run: msbuild Plugins\FastScaling\ImageResizer.Plugins.FastScaling.sln /p:Configuration=Release /p:Platform=ARM64 /p:Optimize=True /p:DebugSymbols=True /m /verbosity:minimal

      - name: Run native FastScaling tests (ARM64)
        shell: cmd
        run: Plugins\FastScaling\ARM64\Release\NativeFastScaling.Test.exe -d yes

      - name: Run FastScaling managed tests (ARM64)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=arm64 -no_logo

          echo === Diagnostic: .NET Framework exe architecture ===
          echo class D{static void Main(){System.Console.WriteLine(System.IntPtr.Size);}}> diag.cs
          csc /nologo /platform:anycpu diag.cs
          echo AnyCPU IntPtr.Size:
          diag.exe
          csc /nologo /platform:arm64 /out:diag64.exe diag.cs
          echo ARM64 IntPtr.Size:
          diag64.exe

          echo === Fix xunit runner PE format for ARM64 ===
          corflags Packages\xunit.runner.console.2.9.3\tools\net481\xunit.console.exe
          corflags /PE32- /32BITPREF- /Force Packages\xunit.runner.console.2.9.3\tools\net481\xunit.console.exe
          corflags Packages\xunit.runner.console.2.9.3\tools\net481\xunit.console.exe

          echo === Running managed tests ===
          Packages\xunit.runner.console.2.9.3\tools\net481\xunit.console.exe Tests\binaries\release\ARM64\ImageResizer.Plugins.FastScaling.Tests.dll -nologo
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
